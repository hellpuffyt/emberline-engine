name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Real execution — headless demo (search bot, replay, save/load)
        run: npm run headless
      - name: Asset packer on real PNG bytes
        shell: bash
        run: |
          npm run pack
          grep -q '"coin"' demo/assets/manifest.json
          grep -q '"frames": 4' demo/assets/manifest.json

  lint:
    name: lint (determinism, DOM boundary, deps, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - name: No runtime dependencies
        run: |
          node -e 'const p=require("./package.json"); if (p.dependencies && Object.keys(p.dependencies).length) { console.error("runtime deps found"); process.exit(1) }'
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
